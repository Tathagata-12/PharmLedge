<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - PharmLedge</title>

    <link rel="stylesheet" href="./css/auth.css">

</head>

<body>

    <!-- GLOW -->
    <div class="bg-glow glow1"></div>
    <div class="bg-glow glow2"></div>

    <!-- LOGIN CARD -->

    <div class="auth-container">

        <div class="auth-card">

            <h1>Welcome Back</h1>

            <p>
                Login to your pharmacy dashboard.
            </p>

            <form id="loginForm">

                <input
                    type="email"
                    id="email"
                    placeholder="Email Address"
                    required
                >

                <input
                    type="password"
                    id="password"
                    placeholder="Password"
                    required
                >

                <button type="submit">
                    Login
                </button>

            </form>

            <div class="bottom-text">

                Don't have an account?

                <a href="./register.html">
                    Register
                </a>

            </div>

            <p id="message"></p>

        </div>

    </div>

    <script src="./js/login.js"></script>

</body>

</html>
